defaults:
  - _self_
  - launcher: single
  - reward: qed

# --- experiment identity ---
experiment:
  experiment: da
  note: null
  trial: 1

# --- training schedule ---
train:
  iteration: 200000
  max_steps_per_episode: 40
  aux_distill: 0.0        # >0 enables candidate-set distillation (observation=gnn)
  update_episodes: 1
  eps_threshold: 1.0
  eps_decay: 0.999
  gamma: 0.95     # RL/Bellman discount (distinct from reward.discount_factor)
  polyak: 0.995

# --- optimisation ---
optim:
  optimizer: Adam
  lr: 1.0e-4
  min_batch_size: 128
  max_batch_size: 128
  replay_buffer_size: 4000

# --- reward (group reward/ overrides reward.type + named weights) ---
reward:
  type: qed
  bde_ip:
    bde: 0.8
    ip: 0.2
    rrab: 0.5
    # bde_ip2 only: multiplicative single-sided size window (heavy atoms)
    size_n_max: 26.0   # Data/anti_400.txt maximum
    size_k: 3.0
    size_floor: 0.1
  qed:
    qed: 0.8
    sa: 0.2
  penalty_weight: 0.0
  discount_factor: 1.0
  bde_factor: 0.9
  ip_factor: 0.8
  reward_of_invalid_mol: -1000
  ip_ensemble: true   # true: average all 5 aimnet-nse cv models; false: cv4 only

# --- env / observation ---
env:
  # import-time constants (not normally overridden)
  atom_types: [C, O, N]
  allowed_ring_sizes: [3, 5, 6]
  fingerprint_radius: 3
  fingerprint_length: 2048
  allow_removal: true
  allow_no_modification: true
  allow_bonds_between_rings: false
  observation: list      # list | rdkit | numpy | gnn (frozen property-GNN teacher)
  gnn_ckpt: null         # required when observation=gnn; e.g. gnn_models/gnn_qed.pt
  maintain_OH: null   # null/none | exist | same | <int>
  multi_threading: true
  lru_cache_capacity: 128
  cache:
    bde: true     # BDE memoized by canonical SMILES
    ip: false     # IP NOT cached: its value depends on a random ETKDG conformer
  etkdg:
    max_attempts_cache: 7
    max_attempts_uncache: 7
    threads: 1    # intra-rank ETKDG thread pool (RDKit releases the GIL); >1 to parallelize
    deterministic_seed: false   # true: seed ETKDG by molecule identity -> IP reproducible -> cache.ip exact

# --- initial molecules ---
mols:
  init_mol: null
  init_mol_path: null
  num_init_mol: null
  init_mol_start: 0
  gpu_list: [0]

# --- launcher / distribution (group launcher/ overrides these) ---
dist:
  starter: null
  backend: gloo
  mp_world_size: 1
  mp_master_port: 6500
  init_method: null
  torch_num_threads: 1
  seed_offset: -1

# --- checkpoint ---
ckpt:
  checkpoint: null
  use_checkpoint_eps: false

# --- recording / saving ---
record:
  record_top_path: 10
  record_last_path: 5
  record_all_path: false
  save_reward_freq: 100
  save_model_freq: 1000
  save_path_freq: 1000

# --- misc ---
run:
  test: false
  debug: false

hydra:
  run:
    dir: .
  output_subdir: null
